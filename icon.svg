<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="40%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="symbol-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#f43f5e" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Circle with elegant subtle outline -->
  <rect width="512" height="512" rx="140" fill="#fff1f2" />
  <circle cx="256" cy="256" r="210" fill="url(#rose-grad)" filter="url(#shadow)" />
  
  <!-- Modern Vector Open Book Graphics -->
  <g transform="translate(126, 140)" stroke="url(#symbol-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Page -->
    <path d="M12 210V50c0-22 18-40 40-40h68v180H52c-22 0-40 20-40 20z" fill="rgba(255,255,255,0.05)" />
    <!-- Right Page -->
    <path d="M248 210V50c0-22-18-40-40-40h-68v180h68c22 0 40 20 40 20z" fill="rgba(255,255,255,0.05)" />
    <!-- Bottom Cover edge -->
    <path d="M12 210c0 10 8 18 18 18h200c10 0 18-8 18-18" />
    
    <!-- Heart as central guiding compass -->
    <path d="M130 35 C115 10, 70 10, 70 50 C70 92, 130 130, 130 130 C130 130, 190 92, 190 50 C190 10, 145 10, 130 35 Z" fill="#ffe4e6" opacity="0.95" stroke="#ffe4e6" stroke-width="4" transform="translate(0, 20) scale(1.0)" />
  </g>
</svg>
